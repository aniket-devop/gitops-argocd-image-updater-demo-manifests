apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-argocd-image-updater-demo
  labels:
    app: gitops-argocd-image-updater-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gitops-argocd-image-updater-demo
  template:
    metadata:
      labels:
        app: gitops-argocd-image-updater-demo
    spec:
      containers:
        - name: app
          image: ghcr.io/aniket-devop/gitops-argocd-image-updater-demo:1.0.0
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10